<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05080f; }
    canvas { display: block; }
  </style>
</head>
<!-- this is the animated starfield background, every page loads this in an iframe (see .bg-frame)
     so it's its own standalone html file instead of being part of each page -->
<body>
  <canvas id="bg"></canvas>
  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* ── Gradient background ── */
    function drawGradient() {
      const grad = ctx.createRadialGradient(
        canvas.width * 0.4, canvas.height * 0.4, 0,
        canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.85
      );
      grad.addColorStop(0,   '#0d1b3e');
      grad.addColorStop(0.5, '#080d1f');
      grad.addColorStop(1,   '#03050c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    /* ── Particles ── */
    // each particle is a little dot with a random position, color, speed, and its own
    // "pulse" so they fade in/out at slightly different times instead of all blinking together
    const PARTICLE_COUNT = 120;
    const particles = [];

    const COLORS = ['#5c7cfa', '#748ffc', '#91a7ff', '#4dabf7', '#74c0fc', '#a9e34b', '#ff6b9d'];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 0.5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: Math.random() * 0.5 + 0.1,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.02 + 0.005,
      });
    }

    /* ── Floating blobs ── */
    const blobs = [
      { x: canvas.width * 0.2,  y: canvas.height * 0.3,  r: 200, color: '#1a3a6e', vx: 0.15, vy: 0.1 },
      { x: canvas.width * 0.75, y: canvas.height * 0.6,  r: 260, color: '#0e2d5a', vx: -0.1, vy: 0.12 },
      { x: canvas.width * 0.5,  y: canvas.height * 0.85, r: 180, color: '#1e1060', vx: 0.08, vy: -0.15 },
    ];

    function drawBlobs() {
      blobs.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -b.r || b.x > canvas.width + b.r)  b.vx *= -1;
        if (b.y < -b.r || b.y > canvas.height + b.r) b.vy *= -1;

        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, b.color + 'cc');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    /* ── Connections ── */
    // draws a faint line between any two particles close enough together,
    // gets fainter the further apart they are (classic "constellation" effect)
    function drawConnections() {
      const MAX_DIST = 100;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            ctx.strokeStyle = `rgba(91,124,250,${0.12 * (1 - dist / MAX_DIST)})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += p.pulseSpeed;
        const pulsedAlpha = p.alpha + Math.sin(p.pulse) * 0.15;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.globalAlpha = Math.max(0, pulsedAlpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // redraws everything every frame - requestAnimationFrame keeps it synced to the browser's refresh rate
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGradient();
      drawBlobs();
      drawConnections();
      drawParticles();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
