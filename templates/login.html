<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub – Log in / Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
</head>
<body>

  <iframe src="{{ url_for('static', filename='background.html') }}" class="bg-frame" title="background"></iframe>

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <a href="{{ url_for('home') }}" class="nav-logo">Event<em>Hub</em></a>
    <a href="{{ url_for('home') }}" class="back-home">← Back to home</a>
  </nav>

  <!-- ── Auth Page ── -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">

        <!-- Tabs -->
        <div class="tabs">
          <button type="button" class="tab-btn active" id="tabLogin"    onclick="switchTab('login')">Log in</button>
          <button type="button" class="tab-btn" id="tabRegister" onclick="switchTab('register')">Sign up</button>
        </div>

        <!-- ════ LOGIN PANEL ════ -->
        <div class="form-panel active" id="panelLogin">
          <div class="form-header">
            <h2>Welcome back 👋</h2>
            <p>Log in to see your events and registrations.</p>
          </div>
        <form method="POST" action="{{ url_for('login') }}">
          <div class="form-msg" id="loginMsg"></div>

          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" name="email" id="loginEmail" placeholder="your@email.com" />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" name="password" id="loginPassword" placeholder="Enter your password" />
              <button class="toggle-pw" onclick="togglePassword('loginPassword', this)" type="button">👁️</button>
            </div>
          </div>

          <div class="form-extras">
            <label class="checkbox-wrap">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit">Log in to EventHub</button>
        </form>

          <div class="divider"><span>or continue with</span></div>

          <div class="social-row">
            <button class="btn-social">🌐 Google</button>
            <button class="btn-social">🐙 GitHub</button>
          </div>
        </div>

        <!-- ════ REGISTER PANEL ════ -->
        <div class="form-panel" id="panelRegister">
          <div class="form-header">
            <h2>Join EventHub ✨</h2>
            <p>Create your account and start discovering events around you.</p>
          </div>
<form method="POST" action="{{ url_for('register') }}">  
          <div class="form-msg" id="registerMsg"></div>

          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" name="full_name" id="regName" placeholder="Ana Silva" />
            </div>
          </div>

          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" name="email" id="regEmail" placeholder="your@email.com" />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" name="password" id="regPassword" placeholder="At least 8 characters" />
              <button class="toggle-pw" onclick="togglePassword('regPassword', this)" type="button">👁️</button>
            </div>
          </div>

          <!-- Password strength indicator -->
          <div style="margin-top:-0.6rem; margin-bottom:1rem;">
            <div style="display:flex; gap:4px; margin-bottom:4px;">
              <div id="sb1" style="height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.08);transition:background 0.3s;"></div>
              <div id="sb2" style="height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.08);transition:background 0.3s;"></div>
              <div id="sb3" style="height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.08);transition:background 0.3s;"></div>
              <div id="sb4" style="height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.08);transition:background 0.3s;"></div>
            </div>
            <span id="strengthLabel" style="font-size:0.72rem;color:var(--text-muted);"></span>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" name="confirm_password" id="regPasswordConfirm" placeholder="Repeat your password" />
            </div>
          </div>

          <button type="submit" class="btn-submit" style="margin-top:0.25rem;">Create my account</button>
    </form>   
          <p class="terms-note">
            By signing up you agree to our <a href="#">Terms of Service</a>
            and <a href="#">Privacy Policy</a>.
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
